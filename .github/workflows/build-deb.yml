name: build-deb

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check Python sources
        run: |
          python3 --version
          python3 -m py_compile battery_manager.py battery_tray.py

      - name: Build .deb
        run: ./packaging/build-deb.sh

      - name: Inspect package
        run: |
          dpkg-deb -I build/*.deb
          dpkg-deb -c build/*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: battery-manager-deb
          path: build/*.deb
          if-no-files-found: error

      - name: Attach .deb to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
          generate_release_notes: true
